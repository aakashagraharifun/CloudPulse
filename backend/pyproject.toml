[project]
name = "cloudpulse-backend"
version = "0.1.0"
description = "CloudPulse API: cloud cost ingestion, analytics, anomaly detection and investigation"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI Depends()/File() in default arguments is idiomatic
    "UP046",  # keep explicit Generic[T] for Pydantic generic models
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise be mistaken for first-party code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "error::sqlalchemy.exc.SAWarning",
]
