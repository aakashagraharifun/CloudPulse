# Continuous integration: every push and pull request runs the same checks you
# run locally (see docs/development.md). Nothing here deploys anything or uses
# real cloud credentials; the passwords below are throwaway CI-only values.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: ci-only-password

jobs:
  secrets-check:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if an environment file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must not be committed:"; echo "$tracked"; exit 1
          fi

  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudpulse
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudpulse -d cloudpulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudpulse
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudpulse -d cloudpulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &

      - name: Build and start the frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
          PORT=3000 HOSTNAME=127.0.0.1 nohup npm run start:standalone > ../frontend.log 2>&1 &

      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/ready > /dev/null && curl -sf http://127.0.0.1:3000/login > /dev/null && exit 0
            sleep 2
          done
          echo "::error::Servers did not start"; cat api.log frontend.log; exit 1

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload report and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
            frontend.log
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file and build images
        run: |
          cp .env.example .env
          docker compose --profile app config --quiet
          docker compose --profile app build
